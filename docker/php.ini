expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 128M
max_execution_time = 30
upload_max_filesize = 3M
post_max_size = 4M
file_uploads = On
session.cookie_httponly = 1
session.use_strict_mode = 1
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
